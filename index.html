<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你的远程超级智能体已上线</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #050818;
    }
    /* 深空深蓝黑色背景渐变 */
    body {
      background: radial-gradient(ellipse at center, #0a1130 0%, #050818 55%, #02030c 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .title {
      color: #ffffff;
      font-size: clamp(28px, 6vw, 64px);
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      text-shadow: 0 0 24px rgba(140, 180, 255, 0.55),
                   0 0 48px rgba(90, 130, 255, 0.35);
    }
    .subtitle {
      color: #aab8e0;
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 300;
      letter-spacing: 4px;
      margin-top: 22px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="overlay">
    <h1 class="title">你的远程超级智能体已上线</h1>
    <p class="subtitle">云端为你实时渲染</p>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');

      let width, height, stars;
      const STAR_COUNT = 240; // 200 多颗星星

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createStar() {
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          radius: rand(0.4, 1.6),
          speed: rand(0.15, 0.6),          // 缓慢向下流动
          baseAlpha: rand(0.3, 0.9),
          twinkleSpeed: rand(0.005, 0.02),  // 闪烁速度
          phase: Math.random() * Math.PI * 2
        };
      }

      function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push(createStar());
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        for (const s of stars) {
          // 向下流动
          s.y += s.speed;
          if (s.y > height + 2) {
            s.y = -2;
            s.x = Math.random() * width;
          }
          // 闪烁:用正弦波调制透明度
          s.phase += s.twinkleSpeed;
          const alpha = s.baseAlpha * (0.55 + 0.45 * Math.sin(s.phase));

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha.toFixed(3) + ')';
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', init);
      init();
      draw();
    })();
  </script>
</body>
</html>
